<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebDroid</title>
    <link rel="icon" type="image/png" href="./com.android/ic_launcher.png">
      <link rel="apple-touch-icon" href="./com.android/ic_launcher.png">
  <style>
    * { box-sizing: border-box; }

    :root {
      --top: calc(34px + env(safe-area-inset-top, 0px));
      --bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      --bar-bg: transparent;            /* couleur de la barre d'état (celle de l'app au premier plan) */
      --nav-bg: rgba(0, 0, 0, .12);     /* couleur de la barre de navigation */
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.30)),
        url("./com.android/wallpaper.jpg") center center / cover no-repeat;
      position: relative;
      user-select: none;
    }

    /* Tiroir de notifications */
    .notification-drawer {
      position: fixed;
      z-index: 60;
      top: 0;
      left: 0;
      right: 0;
      height: min(72vh, 620px);
      padding: max(12px, env(safe-area-inset-top)) 22px 28px;
      background: rgba(20, 24, 27, .94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.38);
      transform: translateY(-105%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      display: flex;
      flex-direction: column;
      color: #fff;
      overflow-y: auto;
    }

    .notification-drawer.open {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 42px;
      height: 4px;
      margin: 4px auto 18px;
      border-radius: 10px;
      background: rgba(255,255,255,.42);
      flex-shrink: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      flex-shrink: 0;
    }

    .drawer-header > span:first-child {
      font-size: 24px;
      font-weight: 500;
    }

    .drawer-title {
      flex: 1;
      opacity: .7;
    }

    .close-drawer {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    /* Notification Termux Android Style */
    .notification-card {
      background: #f4f6f6;
      color: #191c1d;
      border-radius: 24px;
      padding: 16px 20px;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #3f484a;
    }

    .notif-app-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notif-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #3e636d;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: bold;
      font-family: monospace;
    }

    .notif-chevron {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      display: grid;
      place-items: center;
      font-size: 12px;
      color: #191c1d;
    }

    .notif-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 36px;
    }

    .notif-title {
      font-size: 18px;
      font-weight: 600;
      color: #191c1d;
    }

    .notif-sub {
      font-size: 15px;
      color: #3f484a;
    }

    .notif-actions {
      display: flex;
      gap: 24px;
      margin-left: 36px;
      margin-top: 8px;
    }

    .notif-action-btn {
      background: transparent;
      border: none;
      color: #006874;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .notif-action-btn:active {
      opacity: 0.6;
    }

    .notification-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255,255,255,.58);
      font-size: 15px;
      min-height: 200px;
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 27px;
    }

    .notification-zone {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top);
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .notification-zone.hidden {
      display: none;
    }

    .drawer-open .content,
    .drawer-open .dock,
    .drawer-open .navigation {
      filter: brightness(.72);
      transition: filter .28s ease;
    }

    /* Zone centrale */
    .content {
      position: absolute;
      inset: var(--top) 0 var(--bottom) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding-bottom: 104px; /* place pour le dock */
      z-index: 1;
    }

    /* Horloge numérique minimaliste style Android */
    .digital-clock-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .time-display {
      font-size: 110px;
      font-weight: 300;
      color: #1aae09;
      line-height: 0.9;
      letter-spacing: -3px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .date-display {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
      margin-top: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Grille d'applications */
    .apps-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px 32px;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .app img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 16px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
      transition: transform .15s ease;
    }

    .app:active img {
      transform: scale(0.92);
    }

    .app-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,.75);
    }

    /* Dock (widget Android) */
    .dock {
      position: fixed;
      left: 50%;
      bottom: calc(var(--bottom) + 14px);
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 24px);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      padding: 10px 14px;
      border-radius: 34px;
      background: rgba(28, 32, 38, 0.62);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    .dock::-webkit-scrollbar { display: none; }
    .dock-sep {
      flex-shrink: 0;
      width: 1px;
      height: 38px;
      margin: 0 6px 8px;
      background: rgba(255, 255, 255, 0.22);
    }
    .dock-item {
      flex-shrink: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
      padding: 0 0 10px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .dock-item img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 14px;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease;
    }
    .dock-item:active img { transform: scale(0.88); }
    .dock-item:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
    .dock-dot {
      position: absolute;
      bottom: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .dock-item.running .dock-dot { opacity: 0.9; transform: scale(1); }
    .dock-item.running.minimized .dock-dot { opacity: 0.4; }

    /* Iframe d'exécution */
    .drawer-open .app-window { pointer-events: none; }

    /* Application native (Paramètres, Termux, Termux XWayland) : toujours plein écran */
    .app-window {
      position: fixed;
      top: var(--top);
      left: 0;
      right: 0;
      bottom: var(--bottom);
      z-index: 10;
      display: none;
      flex-direction: column;
      background: #303030;
      overflow: hidden;
    }
    .app-iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      display: block;
      background: #303030;
    }
    .win-bar, .win-shield, .win-resize { display: none; }

    /* Fenêtre de forme libre : uniquement pour les applications X11 (Firefox, Fichiers…) */
    .app-window.floating { background: #f6f5f4; overflow: visible; }
    .app-window.floating.is-normal {
      top: var(--y);
      left: var(--x);
      right: auto;
      bottom: auto;
      width: var(--w);
      height: var(--h);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .app-window.floating.is-normal.focused {
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.18);
    }
    /* Ancrage sur la moitié gauche / droite de l'écran (top et bottom viennent de .app-window) */
    .app-window.floating.snap-left,
    .app-window.floating.snap-right { right: auto; width: 50%; height: auto; }
    .app-window.floating.snap-left { left: 0; }
    .app-window.floating.snap-right { left: 50%; }

    .app-window.floating .win-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      flex-shrink: 0;
      padding: 0 6px 0 12px;
      background: #202226;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-window.floating.is-normal .win-bar { border-radius: 14px 14px 0 0; }
    .app-window.floating.focused .win-bar { background: #2c3138; }
    .app-window.floating:not(.is-normal) .win-bar { cursor: default; }
    .win-title {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9aa0a6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-window.floating.focused .win-title { color: #e8eaed; }
    .win-title img { width: 18px; height: 18px; object-fit: contain; }
    .win-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #e8eaed;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    .win-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .win-btn.close:hover { background: #d93025; }
    .x11-body {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .app-window.floating.is-normal .x11-body { border-radius: 0 0 14px 14px; overflow: hidden; }
    .x11-body img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Clic dans une fenêtre sans focus : le bouclier capte le premier appui */
    .app-window.floating:not(.focused) .win-shield {
      display: block;
      position: absolute;
      left: 0;
      right: 0;
      top: 36px;
      bottom: 0;
      z-index: 2;
    }
    /* Poignées de redimensionnement : 4 bords + 4 coins */
    .win-edge { display: none; position: absolute; z-index: 3; touch-action: none; }
    .app-window.floating.is-normal .win-edge { display: block; }
    .win-edge[data-dir="n"]  { top: -4px; left: 12px; right: 12px; height: 9px; cursor: ns-resize; }
    .win-edge[data-dir="s"]  { bottom: -4px; left: 12px; right: 12px; height: 9px; cursor: ns-resize; }
    .win-edge[data-dir="e"]  { right: -4px; top: 12px; bottom: 12px; width: 9px; cursor: ew-resize; }
    .win-edge[data-dir="w"]  { left: -4px; top: 12px; bottom: 12px; width: 9px; cursor: ew-resize; }
    .win-edge[data-dir="ne"] { top: -5px; right: -5px; width: 16px; height: 16px; cursor: nesw-resize; }
    .win-edge[data-dir="nw"] { top: -5px; left: -5px; width: 16px; height: 16px; cursor: nwse-resize; }
    .win-edge[data-dir="se"] { bottom: -5px; right: -5px; width: 16px; height: 16px; cursor: nwse-resize; }
    .win-edge[data-dir="sw"] { bottom: -5px; left: -5px; width: 16px; height: 16px; cursor: nesw-resize; }

    /* Aperçu de l'ancrage pendant le déplacement */
    .snap-preview {
      display: none;
      position: fixed;
      z-index: 45;
      border: 2px solid rgba(138, 180, 255, 0.95);
      background: rgba(138, 180, 255, 0.18);
      border-radius: 12px;
      pointer-events: none;
    }

    /* Animations d'ouverture / de fermeture */
    @keyframes win-in  { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes win-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.92); } }
    .app-window.anim-in  { animation: win-in 0.16s ease-out; }
    .app-window.anim-out { animation: win-out 0.14s ease-in forwards; }
    @media (prefers-reduced-motion: reduce) {
      .app-window.anim-in, .app-window.anim-out,
      .app-window.anim-min, .app-window.anim-unmin { animation: none; }
    }

    .recents-overlay {
      position: fixed;
      top: var(--top);
      left: 0;
      right: 0;
      bottom: var(--bottom);
      overflow-x: auto;
      background: rgba(10, 14, 18, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: safe center;
      gap: 20px;
      padding: 20px;
    }

    .recents-overlay.open {
      display: flex;
    }

    .recent-card {
      flex-shrink: 0;
      width: 170px;
      height: 270px;
      background: rgba(30, 35, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .recent-card:active {
      transform: scale(0.96);
    }

    .recent-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .recent-card-header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .recent-card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-card-preview {
      flex: 1;
      width: 100%;
      margin: 10px 0;
      background: #303030;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .recent-card-close {
      background: rgba(255, 255, 255, 0.12);
      border: 0;
      color: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }

    .recent-card-close:active {
      background: rgba(255, 80, 80, 0.4);
    }

    /* Barre de navigation */
    .navigation {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--bottom);
      padding: 0 9%;
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--nav-bg);
      transition: background .2s ease;
      z-index: 50;
    }

    .nav-button {
      width: 52px;
      height: 52px;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .back-icon {
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 20px solid #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .home-icon {
      width: 23px;
      height: 23px;
      background: #fff;
      border-radius: 50%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .recent-icon {
      width: 21px;
      height: 21px;
      background: #fff;
      border-radius: 3px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .nav-button:active {
      transform: scale(.88);
    }

    /* ===== Barre d'état ===== */
    .notification-zone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: env(safe-area-inset-top, 0px) 16px 0;
      background: var(--bar-bg);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
      transition: background .2s ease;
    }
    .notification-zone.hidden { display: none; }
    .sb-left, .sb-right { display: flex; align-items: center; min-width: 0; }
    .sb-left { gap: 10px; }
    .sb-right { gap: 7px; }
    .sb-time { font-variant-numeric: tabular-nums; }
    .sb-notifs { display: flex; align-items: center; gap: 6px; }
    .sb-notifs img { width: 15px; height: 15px; border-radius: 4px; object-fit: contain; }
    .sb-right svg { width: 16px; height: 16px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }
    .sb-batt { display: flex; align-items: center; gap: 1px; }
    .sb-batt svg { width: 15px; height: 17px; }
    .sb-batt .pct { font-size: 12px; }

    /* ===== Tiroir : en-tête, volets rapides, luminosité ===== */
    .drawer-gear {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .10);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .drawer-gear svg { width: 20px; height: 20px; fill: #fff; }
    .qs { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
    .qs-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .qs-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 0;
      border-radius: 28px;
      background: #3a3f45;
      color: #e3e3e3;
      font: inherit;
      text-align: left;
      min-width: 0;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, transform .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .qs-tile svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    .qs-tile:active { transform: scale(.97); }
    .qs-tile[aria-pressed="true"] { background: #a8c7fa; color: #062e6f; }
    .qs-text { display: flex; flex-direction: column; min-width: 0; }
    .qs-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qs-sub { font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qs-brightness { display: flex; align-items: center; gap: 12px; }
    .qs-brightness svg { width: 22px; height: 22px; fill: #e3e3e3; flex-shrink: 0; }
    .qs-brightness input { flex: 1; height: 28px; accent-color: #a8c7fa; }
    .notif-icon-img { width: 26px; height: 26px; border-radius: 50%; object-fit: contain; background: #000; }

    /* Atténuation de l'écran (curseur de luminosité) */
    #dim {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s linear;
    }

    /* Retour tactile des boutons de navigation */
    .nav-button { position: relative; }
    .nav-button::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0);
      transition: background .15s ease;
    }
    .nav-button:active::before { background: rgba(255, 255, 255, .22); }

    /* ===== Fenêtres libres : décoration façon Ubuntu (Yaru) ===== */
    .app-window.floating .win-bar { padding: 0 10px 0 100px; background: #2b2b2b; }
    .app-window.floating.focused .win-bar { background: #3c3c3c; }
    .win-title { justify-content: center; }
    .win-btn {
      width: 24px;
      height: 24px;

    .app-window.floating.dragging { box-shadow: 0 28px 64px rgba(0, 0, 0, .68), 0 0 0 1px rgba(255, 255, 255, .22); }
    .app-window.floating.dragging .win-bar { cursor: grabbing; }

    @keyframes win-min   { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--mx), var(--my)) scale(.08); } }
    @keyframes win-unmin { from { opacity: 0; transform: translate(var(--mx), var(--my)) scale(.08); } to { opacity: 1; transform: none; } }
    .app-window.anim-min   { animation: win-min .22s cubic-bezier(.4, 0, .8, .4) forwards; }
    .app-window.anim-unmin { animation: win-unmin .24s cubic-bezier(.2, .8, .2, 1); }

    @media (max-height: 650px) {
      .content { gap: 14px; padding-bottom: 88px; }

      .dock-item img { width: 44px; height: 44px; }
      .dock-item { width: 56px; }
    }
  </style>
</head>
<body>

  <!-- Atténuation de l'écran (luminosité) -->

  <script>
    const drawer = document.getElementById("notificationDrawer");
    const notificationZone = document.getElementById("notificationZone");
    const closeDrawer = document.getElementById("closeDrawer");
    const drawerTime = document.getElementById("drawerTime");

    const notifTermux = document.getElementById("notifTermux");
    const notificationEmpty = document.getElementById("notificationEmpty");
    const notifExit = document.getElementById("notifExit");
    const notifWakelock = document.getElementById("notifWakelock");

    const dock = document.getElementById("dock");
    const btnXWayland = document.getElementById("btnXWayland");
    const btnTermux = document.getElementById("btnTermux");
    const btnSettings = document.getElementById("btnSettings");

    const recentsOverlay = document.getElementById("recentsOverlay");
    const noRecentsMsg = document.getElementById("noRecentsMsg");
    const navBack = document.getElementById("navBack");
    const navHome = document.getElementById("navHome");
    const navRecent = document.getElementById("navRecent");
    const navigationBar = document.querySelector(".navigation");
    const dim = document.getElementById("dim");
    const sbTime = document.getElementById("sbTime");
    const sbNotifs = document.getElementById("sbNotifs");
    const sbRight = document.getElementById("sbRight");
    const qsTiles = document.getElementById("qsTiles");
    const qsBrightness = document.getElementById("qsBrightness");
    const drawerDate = document.getElementById("drawerDate");
    const drawerSettings = document.getElementById("drawerSettings");
    const notifX11 = document.getElementById("notifX11");
    const notifX11Sub = document.getElementById("notifX11Sub");
    const notifX11Open = document.getElementById("notifX11Open");
    const notifX11Stop = document.getElementById("notifX11Stop");

    // Applications natives : toujours en plein écran
    const APPS = {
      xwayland: { title: "Termux XWayland", url: "./com.termux.wayland/AndroidManifest.html", bar: "#000000",
                  card: document.getElementById("cardXWayland"), close: document.getElementById("closeXWayland") },
      termux:   { title: "Termux", url: "./com.termux/AndroidManifest.html", bar: "#000000",
                  card: document.getElementById("cardTermux"), close: document.getElementById("closeTermux") },
      settings: { title: "Paramètres", url: "./com.android.settings/AndroidManifest.html", bar: "#303030",
                  card: document.getElementById("cardSettings"), close: document.getElementById("closeSettings") }
    };

    // Applications X11 : s'ouvrent en fenêtre de forme libre (capture d'écran de la fenêtre).
    // w/h = dimensions de la capture (ajustées au chargement de l'image) ; cmd = commande Termux.
    const X11_APPS = {
      firefox:     { title: "Firefox", icon: "./com.termux/firefox.png", cmd: "firefox", bg: "#f7f6fb",
                     shot: "./com.termux.wayland/firefox.png", w: 1523, h: 1554 },
      nautilus:    { title: "Fichiers", icon: "./com.termux/nautilus.png", cmd: "nautilus", bg: "#ffffff",
                     shot: "./com.termux.wayland/nautilus.png", w: 728, h: 485 },
      trash:       { title: "Corbeille", icon: "./com.termux/trash.png", cmd: "nautilus trash://", bg: "#ffffff",
                     shot: "./com.termux.wayland/nautilus%3Atrash.png", w: 1334, h: 823 },
      libreoffice: { title: "LibreOffice", icon: "./com.termux/libreoffice-main.png", cmd: "libreoffice", bg: "#666666",
                     shot: "./com.termux.wayland/libreoffice-main.png", w: 1539, h: 1475 },
      editor:      { title: "Éditeur de texte", icon: "./com.termux/text-editor.png", cmd: "gnome-text-editor", bg: "#ffffff",
                     shot: "./com.termux.wayland/text-editor.png", w: 1386, h: 1077 }
    };
    const hasOwn = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);

    // Icônes des logiciels Linux dans le dock (après un séparateur)
    function buildLinuxDock() {
      const sep = document.createElement("span");
      sep.className = "dock-sep";
      dock.appendChild(sep);
      for (const k in X11_APPS) {
        const a = X11_APPS[k];
        const b = document.createElement("button");
        b.className = "dock-item";
        b.dataset.x11 = k;
        b.setAttribute("aria-label", a.title);
        b.title = a.title;
        b.innerHTML = '<img alt=""><span class="dock-dot"></span>';
        b.querySelector("img").src = a.icon;
        dock.appendChild(b);
      }
    }
    buildLinuxDock();

    // État des applications
    const openApps = { xwayland: false, termux: false, settings: false };
    const wins = {};      // apps natives ("termux"…) et fenêtres X11 ("x11:firefox"…)
    const shown = {};     // fenêtre affichée (non réduite)
    const xorder = [];    // empilement des fenêtres X11, la dernière est au premier plan
    let activeApp = null; // application native plein écran au premier plan
    let activeX = null;   // fenêtre X11 qui a le focus
    let wakelockAcquired = false;
    const x11 = { started: false, apps: [] };   // session Wayland ; apps = applications X11 en cours (la dernière est au premier plan)
    let termuxReady = false;          // la page Termux est chargée et écoute les commandes
    let pendingCmd = null;            // commande à taper dès que Termux est prêt

    /* ===== Réglages écrits par l'app Paramètres (postMessage) ===== */
    const SETTING_DEFAULTS = {
      devUnlocked: false, devOn: false, usbDebug: false, stayAwake: false, freeform: false,
      wifi: true, bluetooth: false, dnd: false, batterySaver: false,
      brightness: 100                       // 10 à 100 %
    };
    const SETTING_KEYS = Object.keys(SETTING_DEFAULTS);
    const settings = Object.assign({}, SETTING_DEFAULTS);

    // Valide une valeur selon le type du réglage ; undefined = rejetée
    function sanitizeSetting(k, v) {
      const t = typeof SETTING_DEFAULTS[k];
      if (t === "boolean") return typeof v === "boolean" ? v : undefined;
      if (t === "number") return (typeof v === "number" && isFinite(v)) ? Math.min(100, Math.max(10, Math.round(v))) : undefined;
      return undefined;
    }

    function applySettingsFrom(src) {
      SETTING_KEYS.forEach(k => {
        const v = sanitizeSetting(k, src[k]);
        if (v !== undefined) settings[k] = v;
      });
    }

    function loadSettings() {
      try { applySettingsFrom(JSON.parse(localStorage.getItem("tw_settings") || "{}")); }
      catch (e) { /* stockage indisponible */ }
    }

    function saveSettings() {
      try { localStorage.setItem("tw_settings", JSON.stringify(settings)); } catch (e) {}
    }

    const freeformOn = () => settings.devOn && settings.freeform;

    /* ===== Session Wayland / applications X11 ===== */
    function x11State() { return { started: x11.started, freeform: freeformOn(), apps: x11.apps.slice() }; }

    function notifyTermux(msg) {
      const w = wins.termux;
      if (w && w.frame.contentWindow) w.frame.contentWindow.postMessage(msg, "*");
    }

    function broadcastX11() {
      updateNotifications();
      const w = wins.xwayland;
      if (w && w.frame.contentWindow) {
        w.frame.contentWindow.postMessage({ type: "tw-x11-state", state: x11State() }, "*");
      }
    }

    // Lance une application X11 :
    // - avec les fenêtres libres : fenêtre flottante (créée, restaurée ou mise au premier plan)
    // - sans : affichage plein écran dans Termux XWayland, comme dans Termux:X11
    function launchX11(appKey) {
      const i = x11.apps.indexOf(appKey);
      if (i !== -1) x11.apps.splice(i, 1);
      x11.apps.push(appKey);
      if (freeformOn()) openX11(appKey);
      else if (activeApp !== "xwayland") openApp("xwayland");
      broadcastX11();
    }

    // L'application se termine (fenêtre fermée) ; si c'était la dernière, le prompt de Termux revient
    function quitX11(appKey) {
      const i = x11.apps.indexOf(appKey);
      if (i !== -1) x11.apps.splice(i, 1);
      removeWindow("x11:" + appKey);
      renderWindows();
      broadcastX11();
      if (!x11.apps.length) notifyTermux({ type: "tw-termux-idle" });
    }

    function x11Request(d) {
      if (d.action === "start") {
        const already = x11.started;
        x11.started = true;
        if (!already) broadcastX11();
        return { ok: true, already: already };
      }
      if (d.action === "launch") {
        if (!hasOwn(X11_APPS, d.app)) return { ok: false, code: "unknown-app" };
        if (!x11.started) return { ok: false, code: "no-session" };
        launchX11(d.app);
        return { ok: true };
      }
      if (d.action === "interrupt") {   // Ctrl+C dans Termux : arrête la session et toutes ses applications
        endSession();
        return { ok: true };
      }
      return { ok: false, code: "bad-request" };
    }

    function endSession() {
      x11.started = false;
      x11.apps = [];
      dropWindows();
      broadcastX11();
    }

    // Réglage modifié : les applications en cours passent en fenêtres libres ou en plein écran XWayland
    function applyMode() {
      if (freeformOn()) {
        x11.apps.forEach(k => { if (!wins["x11:" + k]) openX11(k); });
      } else {
        dropWindows();
      }
      broadcastX11();
    }

    window.addEventListener("message", (e) => {
      // On identifie l'application émettrice : seules nos propres iframes sont écoutées
      const src = Object.keys(wins).find(k => wins[k].frame && wins[k].frame.contentWindow === e.source);
      if (!src) return;
      const d = e.data;
      if (!d || typeof d !== "object") return;

      if (src === "settings") {
        if (d.type === "tw-settings-get") {
          e.source.postMessage({ type: "tw-settings-state", state: settings }, "*");
        } else if (d.type === "tw-settings-set" && d.state && typeof d.state === "object") {
          applySettingsFrom(d.state);
          saveSettings();
          applySystem();
          applyMode();
        }
      } else if (src === "termux" || src === "xwayland") {
        if (src === "termux" && d.type === "tw-termux-ready") {
          termuxReady = true;
          if (pendingCmd) {
            notifyTermux({ type: "tw-termux-run", cmd: pendingCmd.cmd, animate: pendingCmd.animate });
            pendingCmd = null;
          }
        } else if (d.type === "tw-x11-get") {
          e.source.postMessage({ type: "tw-x11-state", state: x11State() }, "*");
        } else if (d.type === "tw-x11") {
          const res = x11Request(d);
          e.source.postMessage(Object.assign({ type: "tw-x11-result", id: d.id }, res), "*");
        }
      }
    });

    /* ===== Fenêtres ===== */
    const BAR_H = 36;
    const clamp = (v, min, max) => Math.max(min, Math.min(v, Math.max(min, max)));
    const reducedMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const lastGeom = {};   // dernière position/taille de chaque app (mémoire de session)

    function region() {
      const top = notificationZone.getBoundingClientRect().height;
      const nav = navigationBar.getBoundingClientRect().height;
      return { top: top, width: window.innerWidth, height: window.innerHeight - top - nav };
    }

    // Les fenêtres X11 gardent le ratio de leur capture d'écran
    function fitSize(win) {
      const r = region();
      const maxW = Math.min(r.width, (r.height - BAR_H) * win.aspect);
      win.w = clamp(win.w, Math.min(240, maxW), maxW);
      win.h = Math.round(win.w / win.aspect) + BAR_H;
    }

    function fitPos(win) {
      const r = region();
      win.x = clamp(win.x, 0, r.width - win.w);
      win.y = clamp(win.y, r.top, r.top + r.height - win.h);
    }

    function clampWin(win) { fitSize(win); fitPos(win); }

    // win.state : null (fenêtre libre), "max", "left" ou "right" (ancrée).
    // x/y/w/h gardent toujours la géométrie "libre" : on la retrouve en quittant l'état.
    function applyGeom(win) {
      const s = win.el.style, c = win.el.classList;
      s.setProperty("--x", win.x + "px");
      s.setProperty("--y", win.y + "px");
      s.setProperty("--w", win.w + "px");
      s.setProperty("--h", win.h + "px");
      c.toggle("is-normal", !win.state);
      c.toggle("maximized", win.state === "max");
      c.toggle("snap-left", win.state === "left");
      c.toggle("snap-right", win.state === "right");
    }

    function setState(win, state) {
      win.state = state;
      if (!state) clampWin(win);
      applyGeom(win);
    }

    const snapPreview = document.createElement("div");
    snapPreview.className = "snap-preview";
    document.body.appendChild(snapPreview);

    function showSnap(target) {
      if (!target) { snapPreview.style.display = "none"; return; }
      const r = region();
      Object.assign(snapPreview.style, {
        display: "block",
        left: (target === "right" ? r.width / 2 : 0) + "px",
        top: r.top + "px",
        width: (target === "max" ? r.width : r.width / 2) + "px",
        height: r.height + "px"
      });
    }

    function restackX() {
      xorder.forEach((k, i) => { wins[k].el.style.zIndex = String(26 + i); });
    }

    function renderWindows() {
      const recents = recentsOverlay.classList.contains("open");
      for (const k in wins) {
        const w = wins[k];
        const visible = !recents && shown[k] && (w.kind === "x11" || k === activeApp);
        w.el.style.display = visible ? "flex" : "none";
        if (w.kind === "x11") w.el.classList.toggle("focused", k === activeX);
      }
      dock.style.display = (!recents && !activeApp) ? "flex" : "none";
      // Les barres d'état et de navigation prennent la couleur de l'application au premier plan
      const barApp = (!recents && activeApp) ? APPS[activeApp] : null;
      const rs = document.documentElement.style;
      rs.setProperty("--bar-bg", barApp ? barApp.bar : "transparent");
      rs.setProperty("--nav-bg", barApp ? barApp.bar : "rgba(0, 0, 0, .12)");
      renderDock();
    }

    function focusX(key) {
      activeX = key;
      shown[key] = true;
      const i = xorder.indexOf(key);
      if (i !== -1) xorder.splice(i, 1);
      xorder.push(key);
      restackX();
      renderWindows();
    }

    // Fenêtre X11 visible la plus haute (hors fenêtres en cours de fermeture)
    function topVisibleX() {
      for (let i = xorder.length - 1; i >= 0; i--) {
        const k = xorder[i];
        if (shown[k] && !wins[k].closing) return k;
      }
      return null;
    }

    function animateIn(win, fly) {
      if (reducedMotion()) return;
      const c = win.el.classList, cls = fly ? "anim-unmin" : "anim-in";
      c.remove("anim-in", "anim-unmin");
      void win.el.offsetWidth;
      c.add(cls);
      const end = () => c.remove(cls);
      win.el.addEventListener("animationend", end, { once: true });
      setTimeout(end, 300);
    }

    function animateOut(win, done, fly) {
      if (reducedMotion()) { done(); return; }
      const cls = fly ? "anim-min" : "anim-out";
      let finished = false;
      const end = () => {
        if (finished) return;
        finished = true;
        win.el.classList.remove(cls);
        done();
      };
      win.el.classList.add(cls);
      win.el.addEventListener("animationend", end, { once: true });
      setTimeout(end, fly ? 300 : 240);
    }

    // Position de l'icône de l'application dans le dock (null si le dock n'est pas affiché)
    function dockRect(appKey) {
      if (dock.style.display === "none") return null;
      const b = dock.querySelector('.dock-item[data-x11="' + appKey + '"]');
      if (!b) return null;
      const r = b.getBoundingClientRect();
      return r.width ? r : null;
    }

    // Vecteur du centre de la fenêtre vers l'icône du dock (utilisé par les animations de réduction)
    function setFlyVars(win, rect) {
      const w = win.el.getBoundingClientRect();
      win.el.style.setProperty("--mx", ((rect.left + rect.width / 2) - (w.left + w.width / 2)) + "px");
      win.el.style.setProperty("--my", ((rect.top + rect.height / 2) - (w.top + w.height / 2)) + "px");
    }

    function minimizeX(key) {
      const win = wins[key];
      if (!win || !shown[key] || win.closing) return;
      const rect = dockRect(win.app);
      if (rect) setFlyVars(win, rect);
      animateOut(win, () => {
        shown[key] = false;
        if (activeX === key) activeX = topVisibleX();
        renderWindows();
      }, !!rect);
    }

    function restoreX(key) {
      focusX(key);
      const win = wins[key];
      const rect = dockRect(win.app);
      if (rect) setFlyVars(win, rect);
      animateIn(win, !!rect);
    }

    function toggleMax(key) {
      const win = wins[key];
      setState(win, win.state ? null : "max");
    }

    // Retire la fenêtre du DOM (l'application X11 continue de tourner)
    function removeWindow(key) {
      const win = wins[key];
      if (!win) return;
      lastGeom[win.app] = { x: win.x, y: win.y, w: win.w };
      win.el.remove();
      delete wins[key];
      delete shown[key];
      const i = xorder.indexOf(key);
      if (i !== -1) xorder.splice(i, 1);
      if (activeX === key) activeX = topVisibleX();
    }

    function dropWindows() {
      xorder.slice().forEach(removeWindow);
      renderWindows();
    }

    // ✕ ou Retour : animation de fermeture puis fin de l'application
    function closeX(key) {
      const win = wins[key];
      if (!win || win.closing) return;
      if (!shown[key]) { quitX11(win.app); return; }
      win.closing = true;
      animateOut(win, () => quitX11(win.app));
    }

    // Application native : iframe en plein écran, état conservé tant qu'elle n'est pas fermée
    function ensureWindow(key) {
      if (wins[key]) return wins[key];
      const app = APPS[key];

      const el = document.createElement("div");
      el.className = "app-window";
      el.dataset.app = key;

      const frame = document.createElement("iframe");
      frame.className = "app-iframe";
      frame.title = app.title;
      frame.addEventListener("load", () => bindFrameSwipe(frame));
      frame.src = app.url;
      el.appendChild(frame);
      document.body.appendChild(el);

      wins[key] = { kind: "app", el: el, frame: frame };
      return wins[key];
    }

    // Fenêtre de forme libre pour une application X11
    function openX11(appKey) {
      const key = "x11:" + appKey;
      if (wins[key]) {
        if (!shown[key]) restoreX(key); else focusX(key);
        return;
      }
      const app = X11_APPS[appKey];

      const el = document.createElement("div");
      el.className = "app-window floating is-normal";
      el.dataset.app = key;
      el.style.background = app.bg;
      el.innerHTML =
        '<div class="win-bar">' +
          '<div class="win-title"><img alt=""><span></span></div>' +
          '<button class="win-btn" data-act="min" aria-label="Réduire">&#8211;</button>' +
          '<button class="win-btn" data-act="max" aria-label="Agrandir">&#9633;</button>' +
          '<button class="win-btn close" data-act="close" aria-label="Fermer">&times;</button>' +
        '</div>' +
        '<div class="x11-body"><img alt="" draggable="false" decoding="async"></div>' +
        '<div class="win-shield"></div>' +
        ["n", "s", "e", "w", "ne", "nw", "se", "sw"].map(d => '<div class="win-edge" data-dir="' + d + '"></div>').join("");
      el.querySelector(".win-title img").src = app.icon;
      el.querySelector(".win-title span").textContent = app.title;
      const shot = el.querySelector(".x11-body img");
      shot.alt = app.title;
      document.body.appendChild(el);

      // Taille initiale (ratio de la capture, jamais agrandie au-delà de sa taille réelle), puis cascade
      const aspect = app.w / app.h;
      const r = region();
      const n = xorder.length;
      const last = lastGeom[appKey];
      const win = {
        kind: "x11", app: appKey, el: el, aspect: aspect, state: null, closing: false,
        w: last ? last.w : Math.min(r.width * 0.7, 860, app.w, (r.height * 0.88 - BAR_H) * aspect),
        h: 0,
        x: last ? last.x : 40 + n * 36,
        y: last ? last.y : r.top + 16 + n * 36
      };

      // Le ratio réel vient de l'image chargée : les captures peuvent être remplacées sans toucher au code
      shot.addEventListener("load", () => {
        if (!shot.naturalWidth || !shot.naturalHeight) return;
        win.aspect = shot.naturalWidth / shot.naturalHeight;
        if (!win.state) clampWin(win);
        applyGeom(win);
      });
      shot.src = app.shot;

      clampWin(win);
      applyGeom(win);
      wins[key] = win;
      xorder.push(key);
      shown[key] = true;
      wireX11(win, key);
      focusX(key);
      animateIn(win);
    }

    function wireX11(win, key) {
      const el = win.el;
      const bar = el.querySelector(".win-bar");

      // Clic dans une fenêtre sans focus : on lui donne le focus
      el.querySelector(".win-shield").addEventListener("pointerdown", () => focusX(key));

      bar.addEventListener("click", (e) => {
        const b = e.target.closest(".win-btn");
        if (!b) return;
        if (b.dataset.act === "min") minimizeX(key);
        else if (b.dataset.act === "max") toggleMax(key);
        else closeX(key);
      });

      bar.addEventListener("dblclick", (e) => {
        if (!e.target.closest(".win-btn")) toggleMax(key);
      });

      // Déplacement ; un glissé vers le haut = plein écran, vers un côté = moitié d'écran
      bar.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".win-btn")) return;
        focusX(key);
        try { bar.setPointerCapture(e.pointerId); } catch (err) {}
        const rect = bar.getBoundingClientRect();
        const frac = rect.width ? clamp((e.clientX - rect.left) / rect.width, 0, 1) : 0.5;
        let sx = e.clientX, sy = e.clientY, ox = win.x, oy = win.y;
        let started = false, snapTarget = null;

        const move = (ev) => {
          if (!started) {
            if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 4) return;
            started = true;
            el.classList.add("dragging");
            if (win.state) {
              // fenêtre agrandie/ancrée : on la détache et elle suit le curseur
              setState(win, null);
              win.x = Math.round(ev.clientX - win.w * frac);
              win.y = Math.round(ev.clientY - BAR_H / 2);
              sx = ev.clientX; sy = ev.clientY; ox = win.x; oy = win.y;
            }
          }
          win.x = ox + ev.clientX - sx;
          win.y = oy + ev.clientY - sy;
          clampWin(win);
          applyGeom(win);

          const r = region();
          snapTarget = ev.clientY <= r.top + 6 ? "max"
                     : ev.clientX <= 6 ? "left"
                     : ev.clientX >= r.width - 6 ? "right" : null;
          showSnap(snapTarget);
        };
        const up = (ev) => {
          el.classList.remove("dragging");
          bar.removeEventListener("pointermove", move);
          bar.removeEventListener("pointerup", up);
          bar.removeEventListener("pointercancel", up);
          showSnap(null);
          if (started && snapTarget && ev.type === "pointerup") setState(win, snapTarget);
        };
        bar.addEventListener("pointermove", move);
        bar.addEventListener("pointerup", up);
        bar.addEventListener("pointercancel", up);
      });

      // Redimensionnement par les 4 bords et les 4 coins (ratio conservé)
      el.querySelectorAll(".win-edge").forEach((edge) => {
        edge.addEventListener("pointerdown", (e) => {
          focusX(key);
          const dir = edge.dataset.dir;
          try { edge.setPointerCapture(e.pointerId); } catch (err) {}
          const sx = e.clientX, sy = e.clientY, ox = win.x, oy = win.y, ow = win.w, oh = win.h;
          const sgnX = dir.includes("e") ? 1 : dir.includes("w") ? -1 : 0;
          const sgnY = dir.includes("s") ? 1 : dir.includes("n") ? -1 : 0;
          const bodyH = oh - BAR_H;

          const move = (ev) => {
            const kx = sgnX ? (ow + sgnX * (ev.clientX - sx)) / ow : null;
            const ky = sgnY ? (bodyH + sgnY * (ev.clientY - sy)) / bodyH : null;
            const k = kx === null ? ky : ky === null ? kx : (Math.abs(kx - 1) > Math.abs(ky - 1) ? kx : ky);
            win.w = ow * k;
            fitSize(win);
            // le côté opposé à la poignée reste fixe
            if (sgnX < 0) win.x = ox + (ow - win.w);
            if (sgnY < 0) win.y = oy + (oh - win.h);
            fitPos(win);
            applyGeom(win);
          };
          const up = () => {
            edge.removeEventListener("pointermove", move);
            edge.removeEventListener("pointerup", up);
            edge.removeEventListener("pointercancel", up);
          };
          edge.addEventListener("pointermove", move);
          edge.addEventListener("pointerup", up);
          edge.addEventListener("pointercancel", up);
        });
      });
    }

    window.addEventListener("resize", () => {
      for (const k of xorder) { if (!wins[k].state) clampWin(wins[k]); applyGeom(wins[k]); }
    });

    /* ===== Barre d'état, volets rapides, luminosité ===== */
    const ICONS = {
      wifi: "M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z",
      signal: "M2 22h20V2z",
      bluetooth: "M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z",
      dnd: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z",
      saver: "M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM15 13h-2v2h-2v-2H9v-2h2V9h2v2h2v2z"
    };
    const svg = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="' + ICONS[name] + '"/></svg>';

    // Niveau de batterie réel quand le navigateur l'expose (API Battery), sinon valeur simulée
    const battery = { level: 0.85, charging: false, real: false };
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        const upd = () => { battery.level = b.level; battery.charging = b.charging; battery.real = true; renderStatusBar(); };
        upd();
        b.addEventListener("levelchange", upd);
        b.addEventListener("chargingchange", upd);
      }).catch(() => {});
    }

    function batterySvg(level, charging, saver) {
      const color = saver ? "#ffd54f" : (level < 0.2 && !charging) ? "#ff5252" : "#fff";
      const innerH = 14.2 * Math.max(0.04, level);
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<rect x="10" y="2" width="4" height="2" rx=".6" fill="' + color + '"/>' +
        '<rect x="7" y="4" width="10" height="17" rx="1.6" fill="none" stroke="' + color + '" stroke-width="1.6"/>' +
        '<rect x="8.4" y="' + (19.6 - innerH).toFixed(2) + '" width="7.2" height="' + innerH.toFixed(2) + '" fill="' + color + '"/>' +
        (charging ? '<path d="M13 8l-3.2 5H12v4l3.2-5H13z" fill="#1b1b1b"/>' : '') +
        '</svg>';
    }

    function renderStatusBar() {
      const parts = [];
      if (settings.dnd) parts.push(svg("dnd"));
      if (settings.bluetooth) parts.push(svg("bluetooth"));
      if (settings.wifi && navigator.onLine) parts.push(svg("wifi"));
      parts.push(svg("signal"));
      parts.push('<span class="sb-batt">' + batterySvg(battery.level, battery.charging, settings.batterySaver) +
                 '<span class="pct">' + Math.round(battery.level * 100) + '%</span></span>');
      sbRight.innerHTML = parts.join("");
    }

    const QS = [
      { key: "wifi",         icon: "wifi",      name: "Wi-Fi",            sub: on => on ? (navigator.onLine ? "Connecté" : "Aucun réseau") : "Désactivé" },
      { key: "bluetooth",    icon: "bluetooth", name: "Bluetooth",        sub: on => on ? "Activé" : "Désactivé" },
      { key: "dnd",          icon: "dnd",       name: "Ne pas déranger",  sub: on => on ? "Activé" : "Désactivé" },
      { key: "batterySaver", icon: "saver",     name: "Éco. de batterie", sub: on => on ? "Activé" : "Désactivé" }
    ];

    function buildQuickSettings() {
      QS.forEach(t => {
        const b = document.createElement("button");
        b.className = "qs-tile";
        b.dataset.key = t.key;
        b.innerHTML = svg(t.icon) + '<span class="qs-text"><span class="qs-name"></span><span class="qs-sub"></span></span>';
        b.querySelector(".qs-name").textContent = t.name;
        b.addEventListener("click", () => {
          settings[t.key] = !settings[t.key];
          saveSettings();
          applySystem();
          postToSettings();
        });
        qsTiles.appendChild(b);
      });
    }

    function renderQuickSettings() {
      qsTiles.querySelectorAll(".qs-tile").forEach(b => {
        const t = QS.find(x => x.key === b.dataset.key);
        const on = !!settings[t.key];
        b.setAttribute("aria-pressed", String(on));
        b.querySelector(".qs-sub").textContent = t.sub(on);
      });
      qsBrightness.value = String(settings.brightness);
    }

    // Applique les réglages au système : luminosité, icônes d'état, volets rapides
    function applySystem() {
      dim.style.opacity = String(((100 - settings.brightness) / 100) * 0.8);
      renderStatusBar();
      renderQuickSettings();
    }

    // Réglage modifié depuis le tiroir : on prévient l'app Paramètres si elle est ouverte
    function postToSettings() {
      const w = wins.settings;
      if (w && w.frame.contentWindow) {
        w.frame.contentWindow.postMessage({ type: "tw-settings-state", state: settings }, "*");
      }
    }

    buildQuickSettings();
    qsBrightness.addEventListener("input", () => {
      settings.brightness = sanitizeSetting("brightness", Number(qsBrightness.value));
      saveSettings();
      applySystem();
      postToSettings();
    });
    window.addEventListener("online", applySystem);
    window.addEventListener("offline", applySystem);

    /* ===== Dock, notifications, tiroir ===== */
    function renderDock() {
      dock.querySelectorAll(".dock-item").forEach(el => {
        const isApp = !!el.dataset.app;
        const key = "x11:" + el.dataset.x11;
        el.classList.toggle("running", isApp ? !!openApps[el.dataset.app] : x11.apps.includes(el.dataset.x11));
        el.classList.toggle("minimized", !isApp && !!wins[key] && !shown[key]);
      });
    }

    // Envoie une commande à Termux. Visible : elle est tapée à l'écran ; en arrière-plan : exécutée directement
    function sendToTermux(cmd) {
      if (!termuxReady) { pendingCmd = { cmd: cmd, animate: true }; return; }
      const visible = activeApp === "termux" && !recentsOverlay.classList.contains("open");
      notifyTermux({ type: "tw-termux-run", cmd: cmd, animate: visible });
    }

    // Ouvre Termux (redirection) et y lance une commande
    function runInTermux(cmd) {
      openApp("termux");
      sendToTermux(cmd);
    }

    // Icône Linux du dock :
    // - fenêtre libre déjà ouverte -> comportement de barre des tâches
    // - session pas encore démarrée -> redirection vers Termux avec "wayland --start && commande"
    // - session démarrée -> la commande s'exécute dans Termux, qui peut rester en arrière-plan
    function dockLinux(appKey) {
      const key = "x11:" + appKey;
      if (wins[key]) {
        if (!shown[key]) restoreX(key);
        else if (activeX === key) minimizeX(key);
        else focusX(key);
        return;
      }
      const cmd = X11_APPS[appKey].cmd;
      if (!x11.started) runInTermux("wayland --start && " + cmd);
      else sendToTermux(cmd);
    }

    dock.addEventListener("click", (e) => {
      const b = e.target.closest(".dock-item");
      if (!b) return;
      if (b.dataset.app) openApp(b.dataset.app);
      else if (b.dataset.x11) dockLinux(b.dataset.x11);
    });

    function updateNotifications() {
      renderDock();
      notifTermux.style.display = openApps.termux ? "flex" : "none";
      notifX11.style.display = x11.started ? "flex" : "none";
      notificationEmpty.style.display = (openApps.termux || x11.started) ? "none" : "flex";
      const n = x11.apps.length;
      notifX11Sub.textContent = n ? n + " application" + (n > 1 ? "s" : "") + " en cours" : "Aucune application en cours";
      renderNotifIcons();
    }

    // Icônes des notifications actives dans la barre d'état
    function renderNotifIcons() {
      sbNotifs.textContent = "";
      const add = (src) => {
        const i = document.createElement("img");
        i.alt = "";
        i.src = src;
        sbNotifs.appendChild(i);
      };
      if (openApps.termux) add("./com.termux/ic_launcher.png");
      if (x11.started) add("./com.termux.wayland/ic_launcher.webp");
    }

    function setDrawer(open) {
      drawer.classList.toggle("open", open);
      document.body.classList.toggle("drawer-open", open);
      notificationZone.classList.toggle("hidden", open);
    }

    notificationZone.addEventListener("click", () => setDrawer(true));
    closeDrawer.addEventListener("click", () => setDrawer(false));

    /* ===== Cycle de vie des apps natives ===== */
    function showApp(key) {
      const wasVisible = !!wins[key] && shown[key] && activeApp === key &&
                         !recentsOverlay.classList.contains("open");
      recentsOverlay.classList.remove("open");
      setDrawer(false);
      activeApp = key;
      activeX = null;
      shown[key] = true;
      renderWindows();
      if (!wasVisible && wins[key]) animateIn(wins[key]);
    }

    function openApp(key) {
      openApps[key] = true;
      ensureWindow(key);
      showApp(key);
      updateNotifications();
    }

    function goHome() {
      activeApp = null;
      for (const k in wins) if (wins[k].kind === "app") shown[k] = false;
      recentsOverlay.classList.remove("open");
      renderWindows();
    }

    function leaveRecents() {
      recentsOverlay.classList.remove("open");
      renderWindows();
    }

    function closeAppTask(key) {
      openApps[key] = false;
      if (wins[key]) {
        wins[key].el.remove();
        delete wins[key];
      }
      delete shown[key];
      if (activeApp === key) activeApp = null;

      if (key === "termux") {
        wakelockAcquired = false;
        notifWakelock.textContent = "Acquire wakelock";
        termuxReady = false;
        pendingCmd = null;
        endSession();   // fermer Termux arrête la session Wayland et ses fenêtres
      }

      renderWindows();
      renderRecents();
      updateNotifications();
    }

    function renderRecents() {
      let any = false;
      const n = x11.apps.length;
      const previews = {
        xwayland: x11.started ? "Session Wayland · " + n + " app" + (n > 1 ? "s" : "") : "Aucune session",
        termux: "~$",
        settings: "Paramètres"
      };
      for (const key in APPS) {
        APPS[key].card.style.display = openApps[key] ? "flex" : "none";
        if (openApps[key]) any = true;
        const pv = APPS[key].card.querySelector(".recent-card-preview");
        pv.textContent = previews[key];
        pv.style.background = APPS[key].bar;
        pv.style.fontFamily = key === "settings" ? "inherit" : "monospace";
        pv.style.fontSize = key === "termux" ? "20px" : "13px";
      }
      noRecentsMsg.style.display = any ? "none" : "block";
    }

    // Actions dans la notification Termux
    notifExit.addEventListener("click", () => closeAppTask("termux"));

    // Notification de la session Wayland
    notifX11Open.addEventListener("click", () => openApp("xwayland"));
    notifX11Stop.addEventListener("click", () => {
      endSession();
      notifyTermux({ type: "tw-termux-idle" });   // le processus au premier plan est tué : le prompt revient
    });
    drawerSettings.addEventListener("click", () => openApp("settings"));

    notifWakelock.addEventListener("click", () => {
      wakelockAcquired = !wakelockAcquired;
      notifWakelock.textContent = wakelockAcquired ? "Release wakelock" : "Acquire wakelock";
    });

    // Lancement des applications (icônes de l'accueil)
    btnXWayland.addEventListener("click", () => openApp("xwayland"));
    btnSettings.addEventListener("click", () => openApp("settings"));
    btnTermux.addEventListener("click", () => openApp("termux"));

    // Accessibilité clavier pour les icônes
    document.querySelectorAll(".app[role='button']").forEach(el => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
      });
    });

    // Cartes des récents : basculer vers l'app / fermer la tâche
    for (const key in APPS) {
      APPS[key].card.addEventListener("click", (e) => {
        if (e.target.classList.contains("recent-card-close")) return;
        showApp(key);
      });
      APPS[key].close.addEventListener("click", (e) => {
        e.stopPropagation();
        closeAppTask(key);
      });
    }

    // Bouton de navigation : Applications récentes
    navRecent.addEventListener("click", () => {
      if (recentsOverlay.classList.contains("open")) {
        leaveRecents();
      } else {
        renderRecents();
        recentsOverlay.classList.add("open");
        renderWindows();
      }
    });

    // Bouton de navigation : Retour
    navBack.addEventListener("click", () => {
      if (recentsOverlay.classList.contains("open")) {
        leaveRecents();
      } else if (activeApp) {
        goHome();
      } else {
        const top = topVisibleX();
        if (top) closeX(top);   // ferme la fenêtre X11 au premier plan
      }
    });

    // Bouton de navigation : Accueil
    navHome.addEventListener("click", () => {
      setDrawer(false);
      goHome();
    });

    /* ===== Glissement du tiroir ===== */
    // Départ dans les 70 px du haut (coordonnées écran)
    function handleSwipe(startY, endY) {
      const delta = endY - startY;
      if (!drawer.classList.contains("open") && startY < 70 && delta > 70) {
        setDrawer(true);
      } else if (drawer.classList.contains("open") && delta < -70) {
        setDrawer(false);
      }
    }

    let touchStartY = null;

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (touchStartY === null || e.changedTouches.length !== 1) return;
      handleSwipe(touchStartY, e.changedTouches[0].clientY);
      touchStartY = null;
    }, { passive: true });

    // L'iframe capte les touches : on relaie le geste depuis son document
    // (possible si même origine ; sinon seule la barre d'état déclenche le tiroir).
    function bindFrameSwipe(f) {
      try {
        const doc = f.contentDocument;
        if (!doc) return;
        const offset = () => f.getBoundingClientRect().top;
        let y0 = null;
        doc.addEventListener("touchstart", (e) => {
          if (e.touches.length === 1) y0 = e.touches[0].clientY + offset();
        }, { passive: true });
        doc.addEventListener("touchend", (e) => {
          if (y0 === null || e.changedTouches.length !== 1) return;
          handleSwipe(y0, e.changedTouches[0].clientY + offset());
          y0 = null;
        }, { passive: true });
      } catch (err) {
        /* iframe d'une autre origine (ex. file:// sous Chrome) : ignoré */
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setDrawer(false);
        if (recentsOverlay.classList.contains("open")) leaveRecents();
      }
    });

    /* ===== Horloge ===== */
    function updateClock() {
      const now = new Date();

      // Heure dynamique au format HH:MM
      const timeText = [now.getHours(), now.getMinutes()].map(v => String(v).padStart(2, "0")).join(":");
      document.getElementById("digitalTime").textContent = timeText;
      drawerTime.textContent = timeText;
      sbTime.textContent = timeText;

      // Date dynamique en anglais
      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      const dateText = now.toLocaleDateString('en-US', options);
      document.getElementById("digitalDate").textContent = dateText;
      drawerDate.textContent = dateText;
    }

    loadSettings();
    applySystem();
    updateNotifications();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
